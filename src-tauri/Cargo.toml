[package]
name = "nexe-app"
version = "1.0.6"
description = "Tauri v2 desktop app (nexe-app starter template)"
authors = ["Jordi Goy <jgoy@jgoy.net>"]
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"
rust-version = "1.88"
default-run = "nexe-app"
# C21 (2026-04-21): publish=false evita name-squatting a crates.io.
# El repo és starter clonable — cada app derivada ha d'actualitzar author/repo
# abans de publish=true explícit.
publish = false
repository = "https://github.com/jgoy-labs/nexe-app"
homepage = "https://github.com/jgoy-labs/nexe-app"
keywords = ["tauri", "desktop", "nexe"]
categories = ["gui"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexe_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# dev-tools maps to Tauri's own `devtools` feature; gated off by default so the
# WebView inspector is NEVER compiled into release builds (B222). The crate
# `tauri-devtools` does not exist on crates.io — the canonical way is the
# `tauri/devtools` feature flag (see [features] below).
# Add `--features dev-tools` to `pnpm tauri dev` if you need the inspector.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ADR-0017 (2026-04-22): logger pipeline únic `tracing-subscriber` + `tracing-appender`
# substitueix `tauri-plugin-log` (conflicte `log::set_logger` resolt a la Fase 0).
# `rolling::daily(dir, "nexe-app.log")` escriu a `data_local_dir()/com.nexe.app/logs/`
# cross-platform (macOS: `~/Library/Application Support`, Linux: `~/.local/share`,
# Windows: `%LOCALAPPDATA%`) — resol la necessitat de logs persistits a Windows GUI
# release (`windows_subsystem="windows"`) sense stdout accessible.
tracing-appender = "0.2"
percent-encoding = "2"
# Plugin integrity (ADR-0014 actiu)
sha2 = "0.10"
toml = "1.1"
# Bounded threadpool per evitar thread-bomb (1 thread per request).
threadpool = "1.8"
# LRU cap per RATE_LIMITERS i VERIFIED_PLUGINS (evita OOM si entrades per tots els IDs).
# 0.17 és versió patched del RUSTSEC-2026-0002 (IterMut unsound — no afecta get/put/peek que usem)
lru = "0.17"
# serde_json necessari pel tauri::generate_context! macro quan hi ha secció "plugins".
serde_json = "1"
# UUID v4 per session token (128 bits entropia, no re-usable cross-start).
uuid = { version = "1", features = ["v4"] }
# B2 (2026-04-21): URL parsing estructural per `fetch_from_sidecar`.
# `starts_with("http://127.0.0.1:")` era bypass via userinfo (adversarial review PoC, 4 URLs).
# `url::Url::parse` descomposa authority en host/port/username/password — rebutgem userinfo explícit.
url = "2"
# HTTP client per `fetch_from_sidecar` real (2026-05-02).
# `default-features = false` evita arrossegar `native-tls` (OpenSSL) — usem `rustls-tls`
# per portabilitat (sense dep d'OpenSSL al sistema). `json` per deserialitzar respostes.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Sidecar bundle extraction — unpack venv+app tarball to app_data_dir at first launch.
# flate2: gzip decompression (pure Rust, no system zlib). tar: archive extraction with symlink support.
flate2 = "1"
# Pin >= 0.4.45: RUSTSEC-2026-0067 (unpack_in symlink chmod escape) fixed in 0.4.45.
tar = "0.4.46"
# Tauri 2 plugins baseline (single-instance, dialog, log).
# Tots estàndard 2026 per a qualsevol app desktop seriosa.
# B9 (2026-04-21): `tauri-plugin-store` + `tauri-plugin-notification`
# eliminats REALMENT (no només capabilities). An adversarial review va detectar que
# SECURITY.md afirmava "removed" però els plugins seguien inicialitzats (lib.rs:103,105)
# i als deps. Surface reduction ara és completa: 2 plugins menys a memòria + codi d'init
# + build tree (~600KB menys binary estimat, -2 plugin command sets d'IPC surface).
#
# (2026-05-18): `tauri-plugin-deep-link` eliminated. The `nexe://`
# URL handler was an OAuth callback hook never wired to a sanitised handler,
# so any attacker-controlled `nexe://...` link could re-enter the app. The
# product does not currently rely on OS-level deep links; if we re-introduce
# them we will start from a sanitised handler instead of the default plugin.
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# C29: crash-report path via `dirs::data_local_dir()` (escriu a
# `~/Library/Application Support/nexe-app/crashes/` mac, `%LOCALAPPDATA%` Win).
# Ja és transitive dep de Tauri — afegir-lo explícit no pull més res.
dirs = "6"
# Updater feature-gated: requereix pubkey de signing (per ara stub).
# Activar amb `cargo build --features updater` quan el release pipeline sign+notarize estigui operatiu.
tauri-plugin-updater = { version = "2", optional = true }

# Serde derive per HardwareInfo + CatalogModel structs als Tauri commands.
serde = { version = "1", features = ["derive"] }
# Hardware detection (RAM, OS, disk) per onboarding wizard.
# Pin a 0.38.x: 0.39 puja l'MSRV a 1.95 i trencaria el contracte rust-version=1.88 (job CI dedicat).
sysinfo = "0.38"
# tauri-plugin-opener: reintroduir quan Fase 3 ho requereixi per l'agent (obrir URLs externes)
# tauri-plugin-clipboard-manager — opcional per a imatges/HTML al clipboard. Activar a Fase 1+.
# tauri-plugin-clipboard-manager = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
updater = ["tauri-plugin-updater"]
# dev-tools: activates the Tauri WebView inspector via Tauri's own `devtools`
# feature. Never set as default — only enable in debug builds via
# `--features dev-tools` (B222), so it stays out of the release binary.
dev-tools = ["tauri/devtools"]

# Release hardening — binary hygiene (SLSA baseline)
[profile.release]
strip = "symbols"       # treu debug symbols → no info leak de paths dev
lto = true              # link-time optimization → binary més petit
codegen-units = 1       # panic traces deterministes + millor opt
# panic=abort impedeix Sentry/crash-reporting via unwinding (no hi ha hook de panic).
# Decisió conscient: binary més petit + crash immediat (sense stack corruption oculta).
# Per habilitar Sentry: canviar a panic="unwind" i activar tauri-plugin-sentry (Fase futura opt-in).
panic = "abort"

# Lints Clippy per senyalar nous unwrap/expect al codebase
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Process tree kill on Unix (kill -PGID): transitive dep of Tauri, declared explicitly
# so we can call libc::kill(pgid, SIGKILL) to terminate grandchild workers.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

