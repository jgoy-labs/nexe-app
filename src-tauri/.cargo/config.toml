# Build hygiene — minimize disclosure of the builder's FS paths.
#
# `[profile.release] strip = "symbols"` (in `Cargo.toml`) already strips DWARF debug
# info from the release binary. The `--remap-path-prefix` below complements it for
# panic backtraces and `RUST_BACKTRACE=1` output.
#
# If someone runs `strings target/release/nexe-app | grep $HOME`, it must not
# return paths from the builder machine (dev's home, CI path, etc.).

# Previous rustflags with --remap-path-prefix=@CARGO_HOME=@cargo removed
# because they were NO-OP (Cargo does not expand $VAR in config.toml).
# The real remap (RUSTFLAGS with $HOME and $CARGO_HOME expanded + SOURCE_DATE_EPOCH):
#   ./scripts/reproducible-build.sh  ← use for reproducible builds

# Note: variables like $HOME or $CARGO_HOME are NOT expanded in config.toml.
# For a reproducible build with remapping of the real paths + SOURCE_DATE_EPOCH:
#   ./scripts/reproducible-build.sh          (from the repo root)
# This script injects $HOME, $CARGO_HOME and SOURCE_DATE_EPOCH via RUSTFLAGS
# before running cargo build --release.
#
# SLSA maturity: baseline (L1-equivalent). See ADR-0015 for the path to L3
# (sigstore + attested builder + bundle reproducibility).
