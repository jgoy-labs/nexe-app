# Quality-tool configuration for nexe-app (Tauri/Rust).
# NOT a Python project — this file only configures exclusions for dev tools.

[tool.pyright]
# nexe-app is not a Python project; pyright only inspects poc-sidecar
# (standalone script with its own PBS+uv venv). Build artifacts stay out.
include = ["scripts/poc-sidecar"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".mypy_cache",
    ".pytest_cache",
    "dist",
    "target",
    "src-tauri/target",
    "src-tauri/gen",
]
