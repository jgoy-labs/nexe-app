version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # sysinfo >=0.39 puja l'MSRV a Rust 1.95; el projecte manté rust-version=1.88
      # (job CI dedicat). Mantenir-se a 0.38.x fins que es decideixi pujar l'MSRV.
      - dependency-name: "sysinfo"
        versions: [">=0.39"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
