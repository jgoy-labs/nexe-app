name: Weekly Bundle Smoke Test

# C45: CI smoke --no-bundle -> release path cec.
# Aquest workflow fa un build complet amb bundle real (DMG/AppImage/MSI) setmanalment.
# Detecta trencaments de packaging que --no-bundle no detecta.
on:
  schedule:
    - cron: '0 3 * * 1'  # Dilluns 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-mac-arm64:
    name: bundle smoke macOS arm64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: pnpm setup
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Node setup
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # H-001: The sidecar bundle (Python venv + app) requires scripts/build-sidecar.sh
      # which needs a full Python env (uv, fastembed, etc.) — not available in CI.
      # We create a minimal placeholder so Tauri can resolve the resource path and
      # produce a valid DMG structure. The resulting DMG contains a stub sidecar;
      # functional sidecar smoke testing requires a dedicated CI environment.
      # TODO: add build-sidecar.sh step + pnpm tauri:build when CI has Python setup.
      - name: sidecar bundle placeholder (CI only)
        run: |
          mkdir -p src-tauri
          if [ ! -f src-tauri/sidecar-bundle.tar.gz ]; then
            TRIPLE=$(rustc -vV | grep '^host:' | awk '{print $2}')
            STUB="src-tauri/binaries/nexe-sidecar-$TRIPLE"
            mkdir -p "$(dirname "$STUB")"
            [ -f "$STUB" ] || { printf '#!/bin/sh\necho "stub"\n' > "$STUB" && chmod +x "$STUB"; }
            tar czf src-tauri/sidecar-bundle.tar.gz -C src-tauri binaries/nexe-sidecar-$TRIPLE
            shasum -a 256 src-tauri/sidecar-bundle.tar.gz | awk '{print $1}' > src-tauri/sidecar-bundle.sha256
          fi

      - name: Bundle (release, unsigned)
        run: pnpm tauri build

      - name: Verify artifact exists
        run: |
          ls -la src-tauri/target/release/bundle/dmg/*.dmg
          echo "Bundle smoke OK"
