name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel·la runs duplicats quan es push multiples commits a la mateixa PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check + clippy + test + audit + vitest
    # Timeout explicit (default GitHub = 360 min = 6h)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Matrix cross-platform (README diu "multi-platform" — ara de veritat)
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned to SHA40. Dependabot (.github/dependabot.yml) will bump them.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      # CI-H02: fail-fast de les 3 fonts internes de nexe-app.
      # El check complet de les 4 fonts (inclou server-nexe/pyproject.toml)
      # corre al job `version-sync` d'aquest mateix workflow.
      - name: version sync check (3 fonts internes nexe-app)
        shell: bash
        run: bash scripts/check-version-sync.sh --skip-server-nexe

      - name: Install Linux WebKitGTK deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-18
        with:
          components: clippy, rustfmt

      # externalBin (tauri.conf.json) fa que tauri_build comprovi el sidecar a CADA
      # invocació de cargo (check/clippy/test/build), no només al tauri build smoke.
      # Sense un binari, build.rs avorta. Stub mínim (mai s'empaqueta) ABANS del primer cargo.
      - name: sidecar stub (CI smoke only)
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          TRIPLE=$(rustc -vV | grep '^host:' | awk '{print $2}')
          EXT=""
          case "$TRIPLE" in *windows*) EXT=".exe";; esac
          STUB="src-tauri/binaries/nexe-sidecar-$TRIPLE$EXT"
          if [ ! -f "$STUB" ]; then
            printf '#!/bin/sh\necho "stub"\n' > "$STUB"
            chmod +x "$STUB"
          fi

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: pnpm setup
        # Version ve de package.json `packageManager` (evita ERR_PNPM_BAD_PM_VERSION)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Node setup
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: cargo fmt check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo clippy (warnings = error)
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      # C70: clippy --all-targets warning-only (38 warnings actuals en tests/benches).
      # No bloqueja CI; un sprint dedicat els netejara.
      - name: clippy all targets (warning-only)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked 2>&1 | tee clippy-all.log
        continue-on-error: true

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # B055: els tests d'integritat de plugins que verifiquen el camí ESTRICTE
      # (STRICT_INTEGRITY=true, rebuig 403 de plugins manipulats) estan gated rere
      # #[cfg(not(debug_assertions))] i NOMÉS es compilen/corren en release. El job
      # anterior (`cargo test --locked`, debug) no els exercita mai → el mecanisme
      # anti-tampering de la cadena de plugins no tenia cap xarxa de seguretat de
      # test al camí que realment s'executa en producció. Aquest job els corre.
      - name: cargo test (release — integrity gated tests, B055)
        working-directory: src-tauri
        run: cargo test --release --locked

      - name: cargo audit (vulnerability scan)
        working-directory: src-tauri
        run: cargo audit --deny warnings

      # B20 fix: CI bloqueja si una review-date de
      # .cargo/audit.toml ha expirat. SECURITY.md/CHANGELOG afirmen aquest
      # comportament; abans el script només corria via verify.sh.
      - name: check cargo audit ignore dates not expired
        run: bash scripts/check-audit-dates.sh

      # C31: pnpm audit --prod bloquejant (prod deps a produccio = blocker).
      - name: pnpm audit --prod (blocker)
        run: pnpm audit --prod --audit-level=moderate

      # C31: pnpm audit complet (dev deps incloses: vite/vitest/tauri-cli CVEs).
      # warning-only: deps dev no van a produccio, no bloqueja CI.
      - name: pnpm audit all (warning-only)
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: vite build
        run: pnpm run build

      - name: vitest
        run: pnpm test

      # Smoke check del packaging end-to-end.
      # --no-bundle evita generar DMG/AppImage/MSI (rapid, sense artifacts).
      # Si trenca, detectem problemes de packaging ABANS del release pipeline.
      - name: tauri build smoke (no bundle)
        run: pnpm tauri build --no-bundle

  # B29: MSRV check — Cargo.toml declares rust-version = "1.88" but CI always runs
  # with rust-toolchain.toml (1.94.1). If any code silently uses a 1.94-only feature,
  # the MSRV claim is broken without anyone noticing. This job catches that drift.
  msrv-check:
    name: MSRV 1.88 check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Linux WebKitGTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@1.88.0

      # CI-H01b: 'cargo build' dispara la comprovació d'externalBin de tauri_build,
      # que avorta si no existeix un binari sidecar (binaries/ és gitignored).
      # Stub mínim per al triple del host — mateix patró que el job `check` (mai s'empaqueta).
      - name: sidecar stub (CI smoke only)
        run: |
          mkdir -p src-tauri/binaries
          TRIPLE=$(rustc -vV | grep '^host:' | awk '{print $2}')
          STUB="src-tauri/binaries/nexe-sidecar-$TRIPLE"
          if [ ! -f "$STUB" ]; then
            printf '#!/bin/sh\necho "stub"\n' > "$STUB"
            chmod +x "$STUB"
          fi

      # CI-H01: 'cargo build' (no 'check') per cobrir també codegen/linking a MSRV 1.88.
      - name: cargo build at MSRV 1.88
        working-directory: src-tauri
        run: cargo build --locked

  # CI-H02: check complet de les 4 fonts de versió (nexe-app + server-nexe).
  # Job separat i lleuger — no necessita Rust ni Node, només python3 (preinstal·lat).
  # Fa checkout de tots dos repos per poder comparar les 4 fonts en un sol runner.
  version-sync:
    name: version sync (4 fonts)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout nexe-app
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout server-nexe
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: jgoy-labs/server-nexe
          persist-credentials: false
          fetch-depth: 1
          path: _server-nexe

      - name: Check version sync across all 4 sources
        shell: bash
        run: bash scripts/check-version-sync.sh _server-nexe
